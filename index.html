<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Tesorería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F4F0;
    --surface: #FFFFFF;
    --surface-2: #ECEDE7;
    --ink: #1E2A2E;
    --ink-soft: #5C6B6F;
    --ink-faint: #8B9A9D;
    --border: #DBDDD5;
    --border-strong: #C3C7BC;
    --income: #2E6F52;
    --income-bg: #E7F0EA;
    --expense: #9C4130;
    --expense-bg: #F3E7E3;
    --warn: #A8791E;
    --warn-bg: #F5EDDB;
    --info: #33546A;
    --info-bg: #E5EBEE;
    --critical: #7A1F1F;
    --critical-bg: #F7DCDC;
    --radius: 6px;
    --font-head: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14181A; --surface: #1C2225; --surface-2: #232A2D; --ink: #E8EBE9;
      --ink-soft: #A3AFB0; --ink-faint: #6E7A7C; --border: #323B3D; --border-strong: #414C4E;
      --income: #6FBE96; --income-bg: #1E2E27; --expense: #D98D7C; --expense-bg: #33231F;
      --warn: #D9B15E; --warn-bg: #332C1B; --info: #8FB4CB; --info-bg: #1E2A32;
      --critical: #E68A8A; --critical-bg: #3A1E1E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181A; --surface: #1C2225; --surface-2: #232A2D; --ink: #E8EBE9;
    --ink-soft: #A3AFB0; --ink-faint: #6E7A7C; --border: #323B3D; --border-strong: #414C4E;
    --income: #6FBE96; --income-bg: #1E2E27; --expense: #D98D7C; --expense-bg: #33231F;
    --warn: #D9B15E; --warn-bg: #332C1B; --info: #8FB4CB; --info-bg: #1E2A32;
    --critical: #E68A8A; --critical-bg: #3A1E1E;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .app { display: flex; min-height: 100%; }

  .sidebar { width: 226px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .brand { font-family: var(--font-head); font-weight: 600; font-size: 18px; letter-spacing: 0.2px; padding: 4px 8px 18px 8px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .brand small { display:block; font-family: var(--font-body); font-size: 11px; color: var(--ink-faint); font-weight: 500; margin-top: 2px; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav button { all: unset; cursor: pointer; padding: 9px 10px; border-radius: var(--radius); font-size: 13.5px; font-weight: 500; color: var(--ink-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav button:hover { background: var(--surface-2); color: var(--ink); }
  .nav button.active { background: var(--info-bg); color: var(--info); font-weight: 600; }
  .nav .badge { background: var(--warn); color: #fff; font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 999px; font-weight: 600; }
  .nav .badge.crit { background: var(--critical); }
  .sidebar-foot { font-size: 11px; color: var(--ink-faint); padding: 10px 8px 2px; border-top: 1px solid var(--border); margin-top: 10px; }

  .main { flex: 1; min-width: 0; padding: 26px 32px 60px; max-width: 1180px; }
  .topbar { display:flex; align-items:baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  h1 { font-family: var(--font-head); font-size: 24px; font-weight: 600; margin: 0; }
  .subtitle { color: var(--ink-soft); font-size: 13px; margin-top: 3px; }
  .btn { all: unset; cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); display: inline-flex; align-items:center; gap:6px; }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-danger { color: var(--expense); border-color: var(--expense); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow: hidden; }
  .kpi .label { font-size: 11.5px; color: var(--ink-soft); font-weight: 500; }
  .kpi .value { font-family: var(--font-mono); font-size: 21px; font-weight: 600; margin-top: 5px; word-break: break-word; }
  .kpi .value.income { color: var(--income); }
  .kpi .value.expense { color: var(--expense); }
  .kpi .sub { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
  .card h2 { font-family: var(--font-head); font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; }

  .banner-critical { background: var(--critical-bg); color: var(--critical); border: 1px solid var(--critical); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px; display:flex; align-items:center; gap:8px; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; touch-action: pan-x pan-y; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--ink-soft); font-size: 11.5px; padding: 7px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  .num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .pill { display:inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-income { background: var(--income-bg); color: var(--income); }
  .pill-expense { background: var(--expense-bg); color: var(--expense); }
  .pill-warn { background: var(--warn-bg); color: var(--warn); }
  .pill-info { background: var(--info-bg); color: var(--info); }
  .pill-critical { background: var(--critical-bg); color: var(--critical); }
  .pill-neutral { background: var(--surface-2); color: var(--ink-soft); }
  .empty { color: var(--ink-faint); font-size: 13px; padding: 16px 4px; }

  .alert-item { display:flex; align-items:center; gap:10px; padding: 9px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .alert-item:last-child { border-bottom: none; }
  .alert-item.critical { background: var(--critical-bg); border-radius: 4px; padding: 9px 8px; margin-bottom: 4px; border-bottom:none; }
  .alert-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink:0; }
  .alert-item .amt { margin-left: auto; font-family: var(--font-mono); }

  .split { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .contact-card .field { margin-bottom: 10px; }
  .contact-card .field .k { font-size: 11px; color: var(--ink-faint); }
  .contact-card .field .v { font-size: 13.5px; margin-top: 1px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,24,26,0.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); width: 100%; max-width: 480px; padding: 22px 24px 24px; }
  .modal h3 { font-family: var(--font-head); font-size: 17px; margin: 0 0 16px; }
  .form-row { margin-bottom: 13px; }
  .form-row label { display:block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 13.5px; }
  .form-row input[type=checkbox] { width: auto; margin-right: 7px; }
  .form-row.checkline { display:flex; align-items:center; }
  .form-row.checkline label { margin: 0; font-size: 13.5px; color: var(--ink); }
  .modal-actions { display:flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .field-hint { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

  .prov-table th, .prov-table td { text-align: right; }
  .prov-table th:first-child, .prov-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  .prov-table tr.total td { font-weight: 700; border-top: 2px solid var(--border-strong); }
  .prov-table tr.net td { font-weight: 700; }
  .prov-table td.neg { color: var(--expense); }
  .prov-table td.pos { color: var(--income); }
  .prov-table { min-width: 860px; }
  @media (max-width: 760px), (hover: none) and (pointer: coarse) and (max-width: 1280px) {
    .prov-table th:first-child, .prov-table td:first-child { position: static; }
  }

  .section-toggle { display:flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .section-toggle button { all:unset; cursor:pointer; font-size:12.5px; font-weight:600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--ink-soft); }
  .section-toggle button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .month-group { margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .month-group-head { display:flex; justify-content: space-between; padding: 8px 12px; background: var(--surface-2); font-weight: 600; font-size: 12.5px; }
  .grand-total { display:flex; justify-content: space-between; padding: 10px 12px; font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--border-strong); margin-top: 4px; }
  .week-callout { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .month-card-list .row { display:flex; justify-content:space-between; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .month-card-list .row.total { font-weight: 700; border-top: 2px solid var(--border-strong); border-bottom:none; margin-top:4px; padding-top:10px; }
  .month-card-list .row.net.pos { color: var(--income); }
  .month-card-list .row.net.neg { color: var(--expense); }
  .month-nav { display:flex; align-items:center; gap: 10px; margin-bottom: 14px; }
  .month-nav select { font-family: var(--font-body); font-weight:700; font-size:14px; padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); }

  .mobile-topbar { display: none; }
  @media (max-width: 760px), (hover: none) and (pointer: coarse) and (max-width: 1280px) {
    .app { flex-direction: column; }
    .sidebar { display:none; }
    .mobile-topbar { display:flex; align-items:center; justify-content:space-between; position: sticky; top:0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
    .mobile-topbar select { font-family: var(--font-body); font-weight:600; font-size:13.5px; padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); }
    .main { padding: 18px 16px 50px; }
    .kpi-row { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(3, auto); }
    .kpi .value { font-size: 16px; }
    .kpi .label { font-size: 11px; }
    .kpi { padding: 11px 12px; }
  }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--radius); font-size: 13px; z-index: 100; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .link-btn { all:unset; cursor:pointer; color: var(--info); font-size: 12.5px; font-weight: 600; }
  .muted { color: var(--ink-faint); }
  .checkcol { width: 28px; }
  .sheet-done { background: #E9F27A !important; }
  @media (prefers-color-scheme: dark) { .sheet-done { background: #4a5216 !important; color: #f1f5c4; } }
  :root[data-theme="dark"] .sheet-done { background: #4a5216 !important; color: #f1f5c4; }
  .sheet-done td { border-bottom-color: #cfd968; }
  .sheet-cards { display: none; }
  .sheet-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 7px; background: var(--surface); }
  .sheet-card.sheet-done { border-color: #cfd968; }
  .sheet-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 3px; }
  .sheet-card-name { font-weight: 600; font-size: 12.5px; }
  .sheet-card-top input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; }
  .sheet-card-main { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; gap: 8px; }
  .sheet-card-amount { font-family: var(--font-mono); font-size: 15px; font-weight: 700; }
  .sheet-card-due { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .sheet-card-meta { font-size: 10.5px; color: var(--ink-faint); }
  @media (max-width: 760px), (hover: none) and (pointer: coarse) and (max-width: 1280px) {
    .sheet-table-wrap { display: none; }
    .sheet-cards { display: block; }
  }
  /* nada debe ensanchar la página en el móvil (un desplegable con texto largo la ensanchaba y el móvil mostraba el diseño de ordenador) */
  html, body { overflow-x: hidden; }
  select, input[type=month], input[type=date] { max-width: 100%; }
  #negEffect, #negBank, #remitBank { width: 100%; max-width: 100%; text-overflow: ellipsis; }
  #negEffect, #negBank { min-width: 0; }
  /* Resumen en el ordenador: clientes en la fila de arriba y proveedores en la de abajo, con tarjetas más grandes (el móvil conserva su diseño) */
  @media (min-width: 761px) and (pointer: fine), (min-width: 1281px) {
    .kpi-res { grid-template-columns: repeat(3, 1fr); grid-auto-flow: row; gap: 16px; }
    .kpi-res .kpi { padding: 20px 22px; }
    .kpi-res .kpi .label { font-size: 13px; }
    .kpi-res .kpi .value { font-size: 28px; margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand"><img src="logo.png" alt="" style="display:block;max-width:100%;max-height:56px;margin:0 0 8px;object-fit:contain" onerror="this.remove()">Panel de Tesorería<small>Cobros · Pagos · Obras</small></div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-foot">Datos compartidos y en vivo entre todos los que abran este panel.</div>
  </nav>
  <div class="mobile-topbar">
    <strong style="font-family: var(--font-head); font-size:15px;">Panel de Tesorería</strong>
    <select id="mobileNav"></select>
  </div>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  if (typeof window.claude !== 'undefined') return;
  var CFG_KEY = 'panelTesoreriaCfg';
  var COLS = ['clients','suppliers','works','invoicesOut','invoicesIn','fixedExpenses','fixedExpensePayments','workBudgetItems','priceListItems','invoiceOutPayments','invoiceInPayments','bankAccounts','bankBalances','oneOffExpenses','bankTransfers','materialGlossary'];
  var getCfg = function () { try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; } };
  var setCfg = function (c) { try { if (c) localStorage.setItem(CFG_KEY, JSON.stringify(c)); else localStorage.removeItem(CFG_KEY); } catch (e) {} };

  /* ---------- defensa de formatos: fechas, importes y casillas que lleguen como texto ---------- */
  var DATE_F = ['date','dueDate','paidDate','collectedDate','nextDate','remittanceDate','emissionDate','issueDate','lastDate','offerDate'];
  var NUM_F = ['amount','budget','paymentTermDays','installmentsRemaining','quantity','unitPrice','price','base','iva','ivaAmount','ivaRate','pieces','length','width','thickness','polishedFaces','drips','defaultThickness','unitCost'];
  var BOOL_F = ['collected','paid','remesado','autoIvaCalc','received','archived','ivaExempt','main','negotiated'];
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var okDate = function (y, m, d) { var t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d; };
  var iso = function (y, m, d) { return okDate(y, m, d) ? y + '-' + pad(m) + '-' + pad(d) : null; };
  function normDate(v) {
    if (v === '' || v == null) return { v: v };
    if (typeof v === 'number' || (typeof v === 'string' && /^\d{5}$/.test(v.trim()))) {
      var n = Number(v); if (n > 20000 && n < 80000) return { v: new Date(Date.UTC(1899, 11, 30) + n * 86400000).toISOString().slice(0, 10), fixed: true };
      return { v: v, bad: true };
    }
    if (typeof v !== 'string') return { v: v, bad: true };
    var s = v.trim(), m;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return { v: okDate(+s.slice(0, 4), +s.slice(5, 7), +s.slice(8, 10)) ? s : v, bad: !okDate(+s.slice(0, 4), +s.slice(5, 7), +s.slice(8, 10)) };
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})[T ]/))) { var r = iso(+m[1], +m[2], +m[3]); return r ? { v: r, fixed: true } : { v: v, bad: true }; }
    if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/))) {
      var d = +m[1], mo = +m[2], y = +m[3]; if (m[3].length === 2) y += 2000;
      if (mo > 12 && d <= 12) { var t = d; d = mo; mo = t; } /* día/mes por defecto; si el mes no puede ser mayor de 12, se entiende mes/día */
      var r2 = iso(y, mo, d); return r2 ? { v: r2, fixed: true } : { v: v, bad: true };
    }
    return { v: v, bad: true };
  }
  function normNum(v) {
    if (typeof v !== 'string') return { v: v };
    var s = v.replace(/[\s\u00a0€]/g, '');
    if (s === '') return { v: v };
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return { v: Number(s.replace(/\./g, '').replace(',', '.')), fixed: true };
    if (/^-?\d+,\d+$/.test(s)) return { v: Number(s.replace(',', '.')), fixed: true };
    if (/^-?\d+(\.\d+)?$/.test(s)) return { v: Number(s), fixed: true };
    return { v: v, bad: true };
  }
  function normBool(v) {
    if (typeof v !== 'string') return { v: v };
    var s = v.trim().toLowerCase();
    if (['true', 'verdadero', 'si', 'sí', 'yes', '1', 'x'].indexOf(s) >= 0) return { v: true, fixed: true };
    if (['false', 'falso', 'no', '0', ''].indexOf(s) >= 0) return { v: false, fixed: true };
    return { v: v, bad: true };
  }
  var rare = { fixed: 0, bad: [] };
  function normRecord(c, id, d) {
    DATE_F.forEach(function (k) { if (k in d) { var r = normDate(d[k]); d[k] = r.v; if (r.fixed) rare.fixed++; if (r.bad) rare.bad.push(c + ' · ' + id + ' · ' + k + ' = ' + JSON.stringify(d[k])); } });
    NUM_F.forEach(function (k) { if (k in d) { var r = normNum(d[k]); d[k] = r.v; if (r.fixed) rare.fixed++; if (r.bad) rare.bad.push(c + ' · ' + id + ' · ' + k + ' = ' + JSON.stringify(d[k])); } });
    BOOL_F.forEach(function (k) { if (k in d) { var r = normBool(d[k]); d[k] = r.v; if (r.fixed) rare.fixed++; if (r.bad) rare.bad.push(c + ' · ' + id + ' · ' + k + ' = ' + JSON.stringify(d[k])); } });
    return d;
  }
  function rareBanner() {
    var el = document.getElementById('rareBanner');
    if (!rare.bad.length) { if (el) el.remove(); return; }

    <div class="firma">${e.firmante ? escapeHtml(e.firmante) + '<br>' : ''}${escapeHtml(e.nombre)}</div>
  </body></html>`;
}
function computeAutoIva(mKey) {
  const end = dayjs(mKey + '-01').endOf('month');
  const start = dayjs(mKey + '-01').subtract(2, 'month').startOf('month');
  const inRange = (d) => { const dd = dayjs(d); return dd.isValid() && !dd.isBefore(start) && !dd.isAfter(end); };
  const facturado = state.invoicesOut.filter(i=>inRange(i.date) && !i.ivaExempt).reduce((s,i)=>s+Number(i.amount||0),0);
  const recibido = state.invoicesIn.filter(i=>inRange(i.date) && !i.ivaExempt).reduce((s,i)=>s+Number(i.amount||0),0);
  return (facturado - recibido) * 21 / 121;
}

const IMPORT_PROMPT = `Eres un asistente de administración de una empresa que vende materiales de construcción con fábrica propia y suministra obras. Te muestro la imagen de un documento. Devuelve SOLO un JSON, sin texto antes ni después y sin bloques de código, con exactamente este formato:
{"docType":"factura_emitida|factura_recibida|presupuesto|pagare|desconocido","counterpartName":"","number":"","date":"YYYY-MM-DD","dueDate":"YYYY-MM-DD","amount":0,"workName":"","paymentMethod":"","instrumentType":"","issuingBank":"","relatedInvoiceNumber":"","lineItems":[{"material":"","unit":"","quantity":0,"unitPrice":0}]}
Usa "factura_emitida" si el documento lo emite nuestra empresa a un cliente (nosotros vendemos/suministramos). Usa "factura_recibida" si lo emite un proveedor hacia nosotros (nosotros compramos). Usa "presupuesto" si es un presupuesto ofrecido a un cliente, no una factura. Usa "pagare" si el documento es un pagaré, confirming o cheque en sí mismo (el instrumento de pago, normalmente con datos de librador, librado/banco e importe), no una factura. "counterpartName" es el nombre del cliente (si es emitida, presupuesto o pagaré) o del proveedor (si es recibida), tal cual aparece. "amount" es el importe TOTAL con IVA incluido si figura, como número sin símbolo de moneda ni separador de miles (usa punto decimal). "paymentMethod" solo para facturas, si puedes inferirlo con seguridad, uno de: Transferencia, Pagaré, Confirming, Cheque, Efectivo; si no, cadena vacía. Para un pagaré/efecto usa además: "instrumentType" (uno de Pagaré, Confirming, Cheque), "issuingBank" (el banco que aparece en el documento), "relatedInvoiceNumber" (el número de factura al que se refiere el pagaré, si lo menciona; si no, ""), y "dueDate" es la fecha de vencimiento del efecto. "lineItems" solo si el documento desglosa materiales o conceptos con cantidad y precio unitario; si no hay desglose, array vacío. Si un dato no aparece en la imagen, usa "" o 0. No inventes nada que no veas.`;

function importErrorMessage(code) {
  const map = {
    not_granted: 'No has dado permiso para que esta web use Claude. Acepta el aviso de permiso cuando aparezca e inténtalo de nuevo.',
    rate_limited: 'Demasiadas peticiones seguidas. Espera un momento y vuelve a intentarlo.',
    image_rejected: 'El archivo no se pudo leer como imagen (formato o tamaño no admitido).',
    images_unavailable: 'Esta vista no permite leer imágenes ahora mismo.',
    invalid_json: 'No se pudo interpretar el documento automáticamente. Introduce los datos a mano.',
    refused: 'No se pudo procesar este documento.',
    empty_completion: 'No se obtuvo respuesta al leer el documento. Prueba de nuevo.',
  };
  return map[code] || 'No se pudo procesar el documento. Inténtalo de nuevo.';
}
async function pdfFileToImageBlob(file) {
  const buf = await file.arrayBuffer();
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 2 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}
function normalizeExtracted(data) {
  return {
    docType: ['factura_emitida','factura_recibida','presupuesto','pagare'].includes(data.docType) ? data.docType : 'desconocido',
    counterpartName: String(data.counterpartName || ''),
    number: String(data.number || ''),
    date: String(data.date || '') || todayISO(),
    dueDate: String(data.dueDate || ''),
    amount: Number(data.amount) || 0,
    workName: String(data.workName || ''),
    paymentMethod: PAYMENT_METHODS.includes(data.paymentMethod) ? data.paymentMethod : '',
    instrumentType: EFFECT_METHODS.includes(data.instrumentType) ? data.instrumentType : 'Pagaré',
    issuingBank: String(data.issuingBank || ''),
    relatedInvoiceNumber: String(data.relatedInvoiceNumber || ''),
    lineItems: Array.isArray(data.lineItems) ? data.lineItems.map(li => ({ material: String(li.material||''), unit: String(li.unit||''), quantity: Number(li.quantity)||0, unitPrice: Number(li.unitPrice)||0 })).filter(li=>li.material) : [],
  };
}
function candidateInvoicesForPagare(clientId, amount, relatedNumber) {
  let pool = state.invoicesOut.filter(i => !i.collected);
  if (clientId && clientId !== '__new__') pool = pool.filter(i => i.clientId === clientId);
  const scored = pool.map(i => {
    let score = 0;
    if (relatedNumber && i.number && i.number.trim() === relatedNumber.trim()) score += 100;
    const diff = Math.abs(Number(i.amount||0) - Number(amount||0));
    if (diff < 0.01) score += 50; else score += Math.max(0, 20 - diff);
    return { i, score };
  }).sort((a,b) => b.score - a.score);
  return scored.map(s => s.i);
}
function bestMatch(list, name) {
  if (!name) return null;
  const n = name.toLowerCase().trim();
  return list.find(x => x.name.toLowerCase().trim() === n) ||
         list.find(x => x.name.toLowerCase().includes(n) || n.includes(x.name.toLowerCase())) || null;
}
function handleImportFiles(files) {
  Array.from(files).forEach(file => {
    const item = { id: 'q' + (++importSeq), file, status: 'processing', errorMsg: '', extracted: null,
      selClient: '', selSupplier: '', selWork: '', selInvoiceMatch: '' };
    importQueue.push(item);
    processImportFile(item);
  });
  renderImport();
}
async function processImportFile(item) {
  try {
    let blob = item.file;
    const isPdf = item.file.type === 'application/pdf' || item.file.name.toLowerCase().endsWith('.pdf');
    if (isPdf) blob = await pdfFileToImageBlob(item.file);
    const data = await sampleApi.json(IMPORT_PROMPT, { images: blob, modelTier: 'default' });
    item.extracted = normalizeExtracted(data);
    if (item.extracted.docType === 'factura_recibida') {
      const m = bestMatch(state.suppliers, item.extracted.counterpartName);
      item.selSupplier = m ? m.id : '__new__';
    } else {
      const m = bestMatch(state.clients, item.extracted.counterpartName);
      item.selClient = m ? m.id : '__new__';
    }
    if (item.extracted.docType === 'pagare') {
      const candidates = candidateInvoicesForPagare(item.selClient, item.extracted.amount, item.extracted.relatedInvoiceNumber);
      item.selInvoiceMatch = candidates[0] ? candidates[0].id : '';
    }
    if (item.extracted.workName) {
      const worksPool = item.selClient && item.selClient !== '__new__' ? state.works.filter(w=>w.clientId===item.selClient) : state.works;
      const mw = bestMatch(worksPool, item.extracted.workName);
      item.selWork = mw ? mw.id : '__new__';
    }
    item.status = 'ready';
  } catch (e) {
    console.error(e);
    item.status = 'error';
    item.errorMsg = importErrorMessage(e.code);
  }
  if (currentSection === 'import') renderImport();
}
async function resolveClientId(item) {
  if (item.selClient === '__new__') {
    const doc = await db.collection('clients').add({ name: item.extracted.counterpartName, cif:'', contactName:'', phone:'', email:'', paymentMethod: item.extracted.paymentMethod||'Transferencia', paymentTermDays:'', notes:'Creado automáticamente al importar un documento.' });
    return doc.id;
  }
  return item.selClient || null;
}
async function resolveSupplierId(item) {
  if (item.selSupplier === '__new__') {
    const doc = await db.collection('suppliers').add({ name: item.extracted.counterpartName, cif:'', contactName:'', phone:'', email:'', paymentMethod: item.extracted.paymentMethod||'Transferencia', paymentTermDays:'', notes:'Creado automáticamente al importar un documento.' });
    return doc.id;

async function resolveWorkId(item, clientId) {
  if (!item.extracted.workName) return '';
  if (item.selWork === '__new__') {
    const doc = await db.collection('works').add({ clientId: clientId||'', name: item.extracted.workName, budget: item.extracted.docType==='presupuesto'?item.extracted.amount:0, status: item.extracted.docType==='presupuesto'?'Presupuestada':'Contratada', notes:'Creada automáticamente al importar un documento.' });
    return doc.id;
  }
  return item.selWork || '';
}
async function saveImportItem(item) {
  try {
    const ex = item.extracted;
    if (ex.docType === 'factura_emitida') {
      const clientId = await resolveClientId(item);
      const workId = await resolveWorkId(item, clientId);
      await db.collection('invoicesOut').add({ clientId, workId, number: ex.number, date: ex.date, amount: ex.amount, dueDate: ex.dueDate, paymentMethod: ex.paymentMethod || 'Transferencia', issuingBank:'', collected:false, collectedDate:'', remesado:false, remittanceBank:'', remittanceDate:'' });
    } else if (ex.docType === 'factura_recibida') {
      const supplierId = await resolveSupplierId(item);
      const workId = await resolveWorkId(item, null);
      await db.collection('invoicesIn').add({ supplierId, workId, number: ex.number, date: ex.date, amount: ex.amount, dueDate: ex.dueDate, paid:false, paidDate:'' });
    } else if (ex.docType === 'presupuesto') {
      const clientId = await resolveClientId(item);
      const workId = await resolveWorkId(item, clientId);
      if (ex.lineItems.length && workId) {
        for (const li of ex.lineItems) await db.collection('workBudgetItems').add({ workId, material: li.material, unit: li.unit, quantity: li.quantity, unitPrice: li.unitPrice });
      } else if (workId) {
        await db.collection('works').doc(workId).update({ budget: ex.amount });
      }
    } else if (ex.docType === 'pagare') {
      if (item.selInvoiceMatch) {
        await db.collection('invoicesOut').doc(item.selInvoiceMatch).update({
          paymentMethod: ex.instrumentType || 'Pagaré', issuingBank: ex.issuingBank, dueDate: ex.dueDate || undefined, effectNumber: ex.number,
        });
      } else {
        const clientId = await resolveClientId(item);
        await db.collection('invoicesOut').add({ clientId, workId:'', number: ex.number, date: ex.date, amount: ex.amount, dueDate: ex.dueDate, paymentMethod: ex.instrumentType || 'Pagaré', issuingBank: ex.issuingBank, collected:false, collectedDate:'', remesado:false, remittanceBank:'', remittanceDate:'' });
      }
    } else {
      showToast('Tipo de documento no reconocido; revísalo a mano.');
      return;
    }
    item.status = 'saved';

        </select></div>`:''}
      ${isPagare?`<div class="form-row"><label>Factura a la que corresponde este pagaré</label><select data-f="selInvoiceMatch" data-id="${item.id}">
          <option value="">— No vincular: crear como factura suelta —</option>
          ${candidates.map(c=>`<option value="${c.id}" ${item.selInvoiceMatch===c.id?'selected':''}>Fra. ${escapeHtml(c.number||'s/n')} · ${fmtDate(c.date)} · ${fmtMoney(c.amount)} · ${escapeHtml(byId(state.clients,c.clientId)?.name||'')}</option>`).join('')}
        </select><div class="field-hint">Se propone la que más se parece en importe${ex.relatedInvoiceNumber?' y número':''}. Cámbiala si no es la correcta.</div></div>`:''}
      ${ex.workName?`<div class="form-row"><label>Obra</label><select data-f="selWork" data-id="${item.id}">
          <option value="">— Sin obra —</option>
          ${state.works.map(w=>`<option value="${w.id}" ${item.selWork===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}

      else item.extracted[el.dataset.f] = el.value;
    };
  });
  root.querySelectorAll('[data-discard]').forEach(b => b.onclick = () => discardImportItem(b.dataset.discard));
  root.querySelectorAll('[data-save]').forEach(b => b.onclick = () => { const item = importQueue.find(i=>i.id===b.dataset.save); if (item) saveImportItem(item); });

function renderDashboard() {
  const totalFacturadoCli = state.invoicesOut.reduce((s,i)=>s+Number(i.amount||0),0);
  const totalCobrado = state.invoicesOut.reduce((s,i)=>s+outCollectedAmount(i),0);
  const pendienteCobro = totalFacturadoCli - totalCobrado;
  const totalFacturadoProv = state.invoicesIn.reduce((s,i)=>s+Number(i.amount||0),0);
  const totalPagado = state.invoicesIn.reduce((s,i)=>s+inPaidAmount(i),0);
  const pendientePago = totalFacturadoProv - totalPagado;

  const criticalWorks = state.works.filter(w => isOverBudget(w.id));

  const alerts = [];
  const sinVencAv = { c: 0, p: 0 };
  allOutLines().filter(l=>!l.collected).forEach(l => {
    if (!isoOk(l.dueDate)) { sinVencAv.c++; return; }
    const d = daysUntil(l.dueDate);
    if (d <= 15) alerts.push({ kind: d<0?'expense':'warn', days: d, overdue: d<0, text: `${byId(state.clients,l.clientId)?.name || 'Cliente'} · Fra. ${l.invoiceNumber||''}`, sub: d<0?`Vencida hace ${-d} días`:(d===0?'Vence hoy':`Vence en ${d} días`), amt: l.amount, type:'in' });
  });
  allInLines().filter(l=>!l.paid).forEach(l => {
    if (!isoOk(l.dueDate)) { sinVencAv.p++; return; }
    const d = daysUntil(l.dueDate);
    if (d <= 15) alerts.push({ kind: d<0?'expense':'warn', days: d, overdue: d<0, text: `${byId(state.suppliers,l.supplierId)?.name || 'Proveedor'} · Fra. ${l.invoiceNumber||''}`, sub: d<0?`Vencida hace ${-d} días`:(d===0?'Vence hoy':`Vence en ${d} días`), amt: -l.amount, type:'out' });
  });

  const upcoming = alerts.filter(a => !a.overdue).sort((a, b) => a.days - b.days), overdue = alerts.filter(a => a.overdue).sort((a, b) => a.days - b.days);
  const alertRow = a => `
              <div class="alert-item">
                <span class="alert-dot" style="background:var(--${a.kind==='expense'?'expense':'warn'})"></span>
                <div><div>${escapeHtml(a.text)}</div><div class="muted" style="font-size:11.5px">${a.sub}</div></div>
                <span class="amt ${a.type==='in'?'':'expense'}">${a.type==='in'?'+':''}${fmtMoney(a.amt)}</span>
              </div>`;
  const months = nextMonths(6);
  const provRows = buildProvision(months);
  const maxAbs = Math.max(1, ...months.map(m => Math.max(Math.abs(provRows.ingresos[m]), Math.abs(provRows.totalPagos[m]))));

  document.getElementById('main').innerHTML = `
    <div class="topbar"><div><h1>Resumen general</h1><div class="subtitle">Hoy es ${dayjs().format('D [de] MMMM [de] YYYY')}</div></div></div>

    ${criticalWorks.length ? `<div class="banner-critical">⚠ ${criticalWorks.length} obra(s) con el coste de proveedores por encima del presupuesto: ${criticalWorks.map(w=>escapeHtml(w.name)).join(', ')}. Revisa la sección Obras.</div>` : ''}

    <div class="kpi-row kpi-res">
      <div class="kpi"><div class="label">Facturado a clientes</div><div class="value">${fmtMoney(totalFacturadoCli)}</div></div>
      <div class="kpi"><div class="label">Cobrado</div><div class="value income">${fmtMoney(totalCobrado)}</div></div>
      <div class="kpi"><div class="label">Pendiente de cobro</div><div class="value">${fmtMoney(pendienteCobro)}</div></div>
      <div class="kpi"><div class="label">Facturado por proveedores</div><div class="value">${fmtMoney(totalFacturadoProv)}</div></div>
      <div class="kpi"><div class="label">Pagado</div><div class="value expense">${fmtMoney(totalPagado)}</div></div>
      <div class="kpi"><div class="label">Pendiente de pago</div><div class="value">${fmtMoney(pendientePago)}</div></div>
    </div>

    <div class="split">
      <div>
        <div class="card">
          <h2>Avisos (próximos 15 días) <span class="muted" style="font-size:12px;font-weight:400">· ${upcoming.length} vencimientos</span></h2>
          ${criticalWorks.map(w=>`<div class="alert-item critical"><span class="alert-dot" style="background:var(--critical)"></span><div><div><strong>Sobrecoste en "${escapeHtml(w.name)}"</strong></div><div style="font-size:11.5px">Coste proveedores ${fmtMoney(workCost(w.id))} supera el presupuesto ${fmtMoney(workBudgetTotal(w.id))}</div></div></div>`).join('')}
          <div style="max-height:560px;overflow:auto">${upcoming.length === 0 ? '<div class="empty">No hay vencimientos en los próximos 15 días.</div>' : upcoming.map(alertRow).join('')}</div>
          ${(sinVencAv.c + sinVencAv.p) ? `<div class="muted" style="margin-top:8px;font-size:12px">${sinVencAv.c} cobros y ${sinVencAv.p} pagos no tienen fecha de vencimiento y no salen en los avisos; se tienen en cuenta, con fecha provisional, en la previsión.</div>` : ''}
          ${overdue.length ? `<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">⚠ ${overdue.length} vencidos sin cobrar o pagar · por cobrar ${fmtMoney(overdue.filter(a=>a.type==='in').reduce((t,a)=>t+a.amt,0))} · por pagar ${fmtMoney(-overdue.filter(a=>a.type==='out').reduce((t,a)=>t+a.amt,0))}</summary><div class="muted" style="margin:4px 0">Normalmente son pagos o cobros que faltan por anotar. Se marcan en Control de efectos.</div><div style="max-height:360px;overflow:auto">${overdue.map(alertRow).join('')}</div></details>` : ''}
        </div>
      </div>
      <div>
        ${expectedCardHtml(months)}
      </div>
    </div>
  `;
}

const qState = { clients: '', suppliers: '', works: '' };
const normS = t => stripAcc(t).replace(/\s+/g, ' ').trim();
function matchSearch(hay, q) { const words = normS(q).split(' ').filter(Boolean); if (!words.length) return true; const h = normS(hay); return words.every(w => h.includes(w)); }
const searchBar = (id, ph) => `<div style="margin-bottom:10px"><input type="search" id="${id}" placeholder="${ph}" autocomplete="off" style="width:100%;max-width:560px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--ink)"> <span class="muted" id="${id}Count" style="margin-left:8px"></span></div>`;
function setupListSearch(key, inputId, items, hayFn, codeFn, nameFn, rowFn, onRow, colspan) {
  const input = document.getElementById(inputId), cnt = document.getElementById(inputId + 'Count'), tb = document.querySelector('#' + inputId + 'Table tbody');
  const paint = () => {
    const q = input.value; qState[key] = q; const nq = normS(q);
    let list = items.filter(it => matchSearch(hayFn(it), q));
    if (nq) list = list.map(it => [String(codeFn(it) || '').trim() === nq ? 0 : normS(nameFn(it)).startsWith(nq) ? 1 : 2, it]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    tb.innerHTML = list.length ? list.map(rowFn).join('') : `<tr><td colspan="${colspan}" class="empty">Nada coincide con «${escapeHtml(q)}».</td></tr>`;
    cnt.textContent = nq ? `${list.length} de ${items.length}` : `${items.length}`;
    tb.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => onRow(tr.dataset.id));
  };
  input.value = qState[key]; input.oninput = paint; input.onkeydown = e => { if (e.key === 'Escape') { input.value = ''; paint(); } }; paint();
}

  recos.push('Anotar el coste de compra en cada partida para medir el beneficio por material y fijar precios con datos.');

const PROV_TERM = 120; /* plazo provisional para clientes y proveedores que no tienen plazo indicado */
function expectedDate(l, isOut) {
  if (isoOk(l.dueDate)) return { date: l.dueDate, prov: false };
  const inv = byId(isOut ? state.invoicesOut : state.invoicesIn, l.invoiceId);
  const base = isoOk(l.date) ? l.date : (inv && isoOk(inv.date) ? inv.date : '');
  if (!base) return { date: '', prov: true, none: true };
  const party = isOut ? byId(state.clients, l.clientId || (inv && inv.clientId)) : byId(state.suppliers, l.supplierId || (inv && inv.supplierId));
  const term = num(party && party.paymentTermDays);
  if (term > 0) return { date: dayjs(base).add(term, 'day').format('YYYY-MM-DD'), prov: false };
  return { date: dayjs(base).add(PROV_TERM, 'day').format('YYYY-MM-DD'), prov: true };
}
function expectedFlows(months) {

    if (e.none) { info.sinFecha++; info.sinFechaA += amt; return; }
    if (e.date > end) return;
    const k = e.date < today ? 'venc' : e.date.slice(0, 7);
    if (!B[k]) return;
    if (kind === 'c') { if (e.prov) { B[k].cp += amt; info.nCp++; info.aCp += amt; } else B[k].cf += amt; }
    else { if (e.prov) { B[k].pp += amt; info.nPp++; info.aPp += amt; } else B[k].pf += amt; }

  allOutLines().filter(l => !l.collected).forEach(l => put(expectedDate(l, true), num(l.amount), 'c'));
  allInLines().filter(l => !l.paid).forEach(l => put(expectedDate(l, false), num(l.amount), 'p'));
  provisionItems(months).filter(i => i.kind === 'out' && i.cat !== 'proveedor').forEach(i => { const k = i.overdue ? 'venc' : i.date.slice(0, 7); if (B[k]) B[k].pf += i.amount; });
  return { cols, B, info };
}

function buildProvision(months) {
  const rows = { gasto:{}, prestamo:{}, impuesto:{}, nomina:{}, proveedores:{}, ingresos:{}, totalPagos:{}, net:{} };
  months.forEach(m => {
    ['gasto','prestamo','nomina'].forEach(cat => {
      rows[cat][m] = state.fixedExpenses.filter(e=>e.category===cat).reduce((s,e)=>s+expenseMonthAmount(e, m),0);
    });
    rows.impuesto[m] = state.fixedExpenses.filter(e=>e.category==='impuesto').reduce((s,e)=>s+expenseMonthAmount(e, m),0);
    rows.proveedores[m] = allInLines().filter(l=>!l.paid && monthKey(l.dueDate)===m).reduce((s,l)=>s+Number(l.amount||0),0);
    rows.ingresos[m] = allOutLines().filter(l=>!l.collected && monthKey(l.dueDate)===m).reduce((s,l)=>s+Number(l.amount||0),0);
    rows.totalPagos[m] = rows.gasto[m]+rows.prestamo[m]+rows.impuesto[m]+rows.nomina[m]+rows.proveedores[m];
    rows.net[m] = rows.ingresos[m] - rows.totalPagos[m];
  });
  return rows;
}

let provisionHorizon = 3;
const PROV_CATS = { cobro: 'Cobro asegurado', proveedor: 'Pago a proveedor', gasto: 'Gasto fijo', prestamo: 'Préstamo', impuesto: 'Impuesto', nomina: 'Nómina', iva: 'IVA trimestral', puntual: 'Gasto puntual' };
function ivaQuarterItems(today, end) {
  const out = [];
  for (let y = today.year() - 1; y <= end.year(); y++) for (let q = 0; q < 4; q++) {
    const qs = dayjs(new Date(y, q * 3, 1)), qe = qs.add(2, 'month').endOf('month');
    const due = q === 3 ? dayjs(new Date(y + 1, 0, 30)) : qe.add(1, 'day').date(20);
    if (due.isBefore(today, 'day') || due.isAfter(end, 'day')) continue;
    const inQ = i => { const d = dayjs(i.date); return d.isValid() && !d.isBefore(qs, 'day') && !d.isAfter(qe, 'day') && !i.ivaExempt; };
    const net = (state.invoicesOut.filter(inQ).reduce((s, i) => s + Number(i.amount || 0), 0) - state.invoicesIn.filter(inQ).reduce((s, i) => s + Number(i.amount || 0), 0)) * 21 / 121;
    if (net > 0.005) out.push({ date: due.format('YYYY-MM-DD'), kind: 'out', cat: 'iva', label: `IVA ${q + 1}T ${y}` + (qe.isAfter(today, 'day') ? ' (estimado con lo registrado hasta hoy)' : ''), amount: net, bank: '' });
  }
  return out;
}
function provisionItems(months, endOverride) {
  const today = dayjs().startOf('day'), end = endOverride || dayjs(months[months.length - 1] + '-01').endOf('month'), items = [];
  const cm = months[0];
  allOutLines().filter(l => !l.collected && EFFECT_METHODS.includes(l.method)).forEach(l => items.push({ date: l.dueDate || todayISO(), kind: 'in', cat: 'cobro', label: `${byId(state.clients, l.clientId)?.name || '—'} · ${l.invoiceNumber || ''} (${l.method})`, amount: Number(l.amount || 0), bank: '' }));
  allInLines().filter(l => !l.paid).forEach(l => items.push({ date: l.dueDate || todayISO(), kind: 'out', cat: 'proveedor', method: l.method, label: `${byId(state.suppliers, l.supplierId)?.name || '—'} · ${l.invoiceNumber || ''} (${l.method})`, amount: Number(l.amount || 0), bank: l.method === 'Efectivo' ? CASH : (EFFECT_METHODS.includes(l.method) ? '' : mainBankId()) }));
  state.oneOffExpenses.filter(x => !x.paid).forEach(x => items.push({ date: x.dueDate || todayISO(), kind: 'out', cat: 'puntual', label: x.concept, amount: Number(x.amount || 0), bank: defBank(x.bank) }));
  state.fixedExpenses.filter(e => !(e.category === 'impuesto' && e.autoIvaCalc)).forEach(e => {
    const cat = e.category || 'gasto', arr = expArrears(e, cm);
    if (arr > 0.005) items.push({ date: dayjs(cm + '-01').subtract(1, 'day').format('YYYY-MM-DD'), kind: 'out', cat, label: `${e.concept} (atrasos)`, amount: arr, bank: defBank(e.bank) });
    months.forEach(m => {
      const pend = expenseMonthAmount(e, m) - expPaid(e.id, m); if (pend <= 0.005) return;
      const dim = dayjs(m + '-01').daysInMonth(), day = Math.min(dayjs(e.nextDate).isValid() ? dayjs(e.nextDate).date() : 1, dim);
      items.push({ date: `${m}-${String(day).padStart(2, '0')}`, kind: 'out', cat, label: e.concept, amount: pend, bank: defBank(e.bank) });
    });
  });
  ivaQuarterItems(today, end).forEach(i => items.push(i));
  return items.filter(i => !dayjs(i.date).isAfter(end, 'day')).map(i => ({ ...i, overdue: dayjs(i.date).isBefore(today, 'day') })).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
const bankNameOf = id => bankOptions(true).find(o => o.value === id)?.label || '';
function renderProvision() {
  const mode7 = provisionHorizon === 'd7';
  const todayD = dayjs().startOf('day'), today = todayD.format('YYYY-MM-DD'), todayMonth = todayD.format('YYYY-MM');
  let months, endDate, periodKeys;
  if (mode7) { periodKeys = Array.from({ length: 7 }, (_, i) => todayD.add(i, 'day').format('YYYY-MM-DD')); months = [...new Set(periodKeys.map(d => d.slice(0, 7)))]; endDate = todayD.add(6, 'day'); }
  else { months = nextMonths(provisionHorizon); periodKeys = months; endDate = dayjs(months[months.length - 1] + '-01').endOf('month'); }
  const monthChoices = Array.from({ length: 15 }, (_, i) => dayjs().startOf('month').add(i - 3, 'month').format('YYYY-MM'));
  if (!provisionMonth || !monthChoices.includes(provisionMonth)) provisionMonth = todayMonth;

function groupByMonth(list, dateField) {
  const groups = {};
  list.forEach(i => { const k = monthKey(i[dateField]); (groups[k] = groups[k] || []).push(i); });
  return Object.keys(groups).sort().map(k => ({ month: k, items: groups[k].sort((a,b)=>(a[dateField]||'').localeCompare(b[dateField]||'')) }));
}

  document.getElementById('main').innerHTML = `

  document.querySelectorAll('[data-open]').forEach(el => el.onclick = ev => { ev.preventDefault(); const [ent, id] = el.dataset.open.split('|'); openEntityModal(ent, id); });

  document.getElementById('prevM').onclick = () => { ctlMonth = dayjs(ctlMonth + '-01').subtract(1, 'month').format('YYYY-MM'); render(); };
  document.getElementById('nextM').onclick = () => { ctlMonth = dayjs(ctlMonth + '-01').add(1, 'month').format('YYYY-MM'); render(); };

      askBank({ title: isProv ? 'Pago del efecto' : 'Cobro del efecto', defBank: isProv ? mainBankId() : (r.remittanceBankId || mainBankId()),

    } else {
      apply(r, isProv ? { paid: false, paidDate: '', paidBank: '' } : { collected: false, collectedDate: '', collectedBank: '', negotiated: false }).then(() => showToast('Marca quitada')).catch(() => { showToast('No se pudo guardar.'); render(); });
    }
  });

      for (const key of keys) { const line = rows.find(l => l.key === key); if (line) await applyOutLineUpdate(line, { remesado: true, remittanceDate: todayISO(), remittanceId: rid, remittanceBankId: selBank.value, remittanceBank: bankName }); }
      ctlSelected = new Set(); showToast(`${keys.length} efecto(s) marcados como remesados`);

}
async function applyOutLineUpdate(l, patch) {
  if (l.id) await db.collection('invoiceOutPayments').doc(l.id).update(patch);
  else await db.collection('invoicesOut').doc(l.invoiceId).update(patch);
}
function negotiableLines() { return allOutLines().filter(l => !l.collected && EFFECT_METHODS.includes(l.method)).map(l => ({ ...l, key: (l.invoiceId || '') + '|' + (l.id || '') })).sort((a, b) => (a.dueDate || '') < (b.dueDate || '') ? -1 : 1); }
function negociarCardHtml() {
  const lines = negotiableLines(), banks = bankOptions(false).filter(o => o.value !== CASH && o.value !== '');
  return `<div class="card"><h2>Negociar un efecto (cobro anticipado)</h2>
    ${lines.length === 0 ? '<div class="empty">No hay efectos pendientes de cobro para negociar.</div>' : `
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <label style="font-size:12px;flex:1 1 260px;min-width:0;max-width:100%">Efecto<br><select id="negEffect"><option value="">Elige el efecto…</option>${lines.map(l => `<option value="${escapeHtml(l.key)}">${escapeHtml(byId(state.clients, l.clientId)?.name || '—')} · ${escapeHtml(l.invoiceNumber || '')} · vence ${fmtDate(l.dueDate)} · ${fmtMoney(l.amount)}</option>`).join('')}</select></label>
      <label style="font-size:12px;flex:1 1 200px;min-width:0;max-width:100%">Banco donde entra el dinero<br><select id="negBank"><option value="">Elige el banco…</option>${banks.map(o => `<option value="${o.value}">${escapeHtml(o.label)}</option>`).join('')}</select></label>
      <label style="font-size:12px">Fecha<br><input type="date" id="negDate" value="${todayISO()}"></label>
      <button class="btn btn-primary" id="negGo" disabled>Negociar</button></div>
    <div class="muted" style="margin-top:8px">Se anota como cobrado por el importe nominal y en Provisión aparece como «Cobros anticipados». El banco descontará intereses y gastos: cuando los conozcas, añádelos como gasto puntual en la hoja Bancos para que cuenten en el balance.</div>`}</div>`;
}
function setupNegociar() {
  const go = document.getElementById('negGo'); if (!go) return;
  const e = document.getElementById('negEffect'), b = document.getElementById('negBank'), d = document.getElementById('negDate');
  const sync = () => { go.disabled = !(e.value && b.value && d.value); };
  [e, b, d].forEach(x => x.onchange = sync); sync();
  go.onclick = async () => {
    const line = negotiableLines().find(l => l.key === e.value); if (!line) return;
    go.disabled = true;
    try { await applyOutLineUpdate(line, { collected: true, collectedDate: d.value, collectedBank: b.value, negotiated: true }); showToast('Efecto negociado: anotado como cobrado'); }
    catch (err) { console.error(err); showToast('No se pudo negociar. Inténtalo de nuevo.'); go.disabled = false; }
  };
}

      { key:'notes', label:'Notas', type:'textarea' },
    ]
  },
  fixedExpense: {
    title: 'Gasto fijo / préstamo / impuesto / nómina', col: 'fixedExpenses',
    fields: [
      { key:'concept', label:'Concepto', type:'text', required:true },
      { key:'category', label:'Categoría', type:'select', options: EXPENSE_CATEGORIES.map(c=>({value:c.id,label:c.label})) },
      { key:'autoIvaCalc', label:'Calcular automáticamente: IVA estimado (21% incluido en los importes) del trimestre', type:'checkbox', showIf: d => d.category === 'impuesto' },
      { key:'amount', label:'Importe (€)', type:'number', required:true, showIf: d => !(d.category === 'impuesto' && d.autoIvaCalc) },
      { key:'bank', label:'Banco de pago habitual', type:'select', options: () => bankOptions() },
      { key:'frequency', label:'Periodicidad', type:'select', options: FREQUENCIES.map(f=>({value:f.id,label:f.label})) },
      { key:'nextDate', label:'Próximo vencimiento', type:'date' },
      { key:'lastDate', label:'Fecha del último plazo (solo préstamos)', type:'date', showIf: d => d.category === 'prestamo' },
      { key:'notes', label:'Notas', type:'textarea' },
    ]
  },
};

function recomputeDueDate(draft, client) {
  if (draft._dueDateAuto === false) return;
  if (client?.paymentTermDays && draft.date) {
    draft.dueDate = dayjs(draft.date).add(Number(client.paymentTermDays), 'day').format('YYYY-MM-DD');
    draft._dueDateAuto = true;
  }
}
function recomputeDueDateSupplier(draft, supplier) {
  if (draft._dueDateAuto === false) return;
  if (supplier?.paymentTermDays && draft.date) {
    draft.dueDate = dayjs(draft.date).add(Number(supplier.paymentTermDays), 'day').format('YYYY-MM-DD');
    draft._dueDateAuto = true;
  }
}

let modalDraft = {};
let modalIsNew = true;

const CASH = 'cash';
const bankOptions = (withBlank = true) => [...(withBlank ? [{ value: '', label: '— Sin indicar —' }] : []), { value: CASH, label: 'Efectivo' }, ...state.bankAccounts.filter(b => !b.archived).map(b => ({ value: b.id, label: b.name }))];
let modalPresetKeys = [];
function openEntityModal(type, id = null, presetData = {}) {
  const cfg = ENTITY_CONFIG[type];
  const existing = id ? byId(state[cfg.col], id) : null;
  modalIsNew = !existing; modalPresetKeys = Object.keys(presetData || {});
  modalDraft = existing ? { ...existing } : { paymentMethod: PAYMENT_METHODS[0], status: WORK_STATUSES[0], category: 'gasto', frequency: 'mensual', date: todayISO(), _dueDateAuto: true, ...presetData };
  if (modalIsNew && (type === 'invoiceOut' || type === 'invoiceIn')) {
    const cfgHooks = cfg.hooks;
    if (type === 'invoiceOut' && cfgHooks?.clientId) cfgHooks.clientId(modalDraft, true);
    if (type === 'invoiceIn' && cfgHooks?.supplierId) cfgHooks.supplierId(modalDraft, true);
  }
  if (type === 'budgetItem' && modalDraft.unit) modalDraft.unit = normUnit(modalDraft.unit) || modalDraft.unit;
  renderModal(type, cfg, id);
}

function budgetLiveHtml(d) {
  const u = normUnit(d.unit); if (!u) return '';
  const q = measureTotal(d), amt = round2(q * num(d.unitPrice)), g = glossaryMatch(d.material), std = g ? String(g.standardSizes || '').trim() : '';
  let warn = '';
  if (g && std && u !== 'ud' && num(d.length) && num(d.width)) {
    const ok = std.split(/[,;]/).some(x => { const p = parseDims(x); return p.length >= 2 && ((p[0] === num(d.length) && p[1] === num(d.width)) || (p[0] === num(d.width) && p[1] === num(d.length))); });
    if (!ok) warn = 'Medida no estándar: lo habitual es cobrarla por unidad.';
  }
  const hints = priceHints(d);
  return `<div class="field-hint" style="margin:6px 0 10px">
    <div><strong>Total medido: ${fmtQty(q, u)}</strong> · <strong>Importe: ${fmtMoney(amt)}</strong></div>
    ${g ? `<div class="muted">Reconocido en el glosario como «${escapeHtml(g.canonical)}»${g.defaultThickness && !num(d.thickness) ? ' · grosor estándar ' + fmtQty(g.defaultThickness) + ' cm (se aplicará al guardar)' : ''}</div>` : ''}
    ${warn ? `<div style="color:var(--warn)">${warn}</div>` : ''}
    ${hints.length ? `<div class="muted">Precios de proveedor: ${hints.map(p => `<a href="#" data-useprice="${p.id}">${fmtMoney(p.price)}/${unitLabel(p.unit)} · ${escapeHtml(byId(state.suppliers, p.supplierId)?.name || '—')}${p.offerDate ? ' · ' + fmtDate(p.offerDate) : ''}</a>`).join(' &nbsp;|&nbsp; ')}</div>` : ''}
  </div>`;
}
function renderModal(type, cfg, id) {
  const root = document.getElementById('modalRoot');
  const resolveOptions = (f) => typeof f.options === 'function' ? f.options(modalDraft) : f.options;
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <h3>${id ? 'Editar' : 'Nuevo'} · ${cfg.title}</h3>
        <form id="entityForm">
          ${cfg.fields.map(f => {
            if (f.showIf && !f.showIf(modalDraft)) return '';
            const val = modalDraft[f.key] ?? '';
            if (f.type === 'select') {
              let opts = resolveOptions(f);
              opts = (typeof opts[0] === 'string' ? opts.map(o=>({value:o,label:o})) : opts);
              if (val !== '' && !opts.some(o=>String(o.value)===String(val))) opts = [{value:val,label:val+' (actual)'}, ...opts];
              if (val === '' && !opts.some(o=>String(o.value)==='')) opts = [{value:'',label:'— Elige —'}, ...opts];
              const optsHtml = opts.map(o => `<option value="${escapeHtml(o.value)}" ${String(o.value)===String(val)?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
              return `<div class="form-row"><label>${f.label}${f.required?' *':''}</label><select data-key="${f.key}">${optsHtml}</select></div>`;
            }
            if (f.type === 'checkbox') {
              return `<div class="form-row checkline"><input type="checkbox" data-key="${f.key}" id="chk_${f.key}" ${val?'checked':''}><label for="chk_${f.key}">${f.label}</label></div>`;
            }
            if (f.type === 'textarea') {
              return `<div class="form-row"><label>${f.label}</label><textarea data-key="${f.key}" rows="2">${escapeHtml(val)}</textarea></div>`;
            }
            return `<div class="form-row"><label>${f.label}${f.required?' *':''}</label><input type="${f.type}" step="${f.type==='number'?'0.01':''}" data-key="${f.key}" value="${escapeHtml(val)}"></div>`;
          }).join('')}
          ${type === 'budgetItem' ? budgetLiveHtml(modalDraft) : ''}
          <div class="modal-actions">
            ${id ? `<button type="button" class="btn btn-danger" id="deleteBtn" style="margin-right:auto">Eliminar</button>` : ''}
            <button type="button" class="btn" id="cancelBtn">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeModal(); };
  document.getElementById('cancelBtn').onclick = closeModal;
  if (id) document.getElementById('deleteBtn').onclick = () => { closeModal(); confirmDelete(cfg.col, id, cfg.title, render); };

  root.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('change', () => {
      const key = el.dataset.key;
      modalDraft[key] = el.type === 'checkbox' ? el.checked : el.value;
      if (cfg.hooks && cfg.hooks[key]) cfg.hooks[key](modalDraft, modalIsNew);
      renderModal(type, cfg, id);
    });
  });

  root.querySelectorAll('[data-useprice]').forEach(a => a.onclick = ev => { ev.preventDefault(); const p = byId(state.priceListItems, a.dataset.useprice); if (!p) return; modalDraft.unitPrice = p.price; if (normUnit(p.unit)) modalDraft.unit = normUnit(p.unit); renderModal(type, cfg, id); });
  document.getElementById('entityForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = { ...modalDraft };
    delete data._pmTouched; delete data._dueDateAuto;
    if (!id) { const ok = new Set([...cfg.fields.map(f => f.key), ...modalPresetKeys, 'workId', 'supplierId', 'clientId']); Object.keys(data).forEach(k => { if (!ok.has(k)) delete data[k]; }); }
    const faltan = cfg.fields.filter(f => f.required && (!f.showIf || f.showIf(modalDraft)) && (data[f.key] === undefined || data[f.key] === null || data[f.key] === '')).map(f => f.label.replace(/\s*\(.*$/, ''));
    if (faltan.length) { showToast('Falta rellenar: ' + faltan.join(', ')); return; }
    cfg.fields.forEach(f => {
      if (f.type === 'number' && data[f.key] !== '' && data[f.key] != null) data[f.key] = Number(data[f.key]);
      if (f.type === 'checkbox') data[f.key] = !!data[f.key];
    });
    if (type === 'budgetItem') {
      const g = glossaryMatch(data.material);
      if (!num(data.thickness) && g && num(g.defaultThickness)) data.thickness = Number(g.defaultThickness);
      data.unit = normUnit(data.unit) || data.unit; data.quantity = measureTotal(data);
    }
    try {
      if (id) await db.collection(cfg.col).doc(id).update(data);
      else await db.collection(cfg.col).add(data);
      showToast('Guardado');
      closeModal();
    } catch (err) { console.error(err); showToast('No se pudo guardar. Inténtalo de nuevo.'); }
  };
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; modalDraft = {}; }

function confirmDelete(col, id, label, onDone) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="delOverlay">
      <div class="modal" style="max-width:380px">
        <h3>Eliminar</h3>
        <p style="font-size:13.5px">¿Seguro que quieres eliminar «${escapeHtml(label)}»? Esta acción no se puede deshacer.</p>
        <div class="modal-actions">
          <button class="btn" id="delCancel">Cancelar</button>
          <button class="btn btn-danger" id="delConfirm">Eliminar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('delOverlay').onclick = (e) => { if (e.target.id==='delOverlay') closeModal(); };
  document.getElementById('delCancel').onclick = closeModal;
  document.getElementById('delConfirm').onclick = async () => {
    try { await db.collection(col).doc(id).delete(); showToast('Eliminado'); } catch(e){ console.error(e); }
    closeModal(); onDone && onDone();
  };
}

// ---------- PAGOS/COBROS PARCIALES ----------
function openPaymentsModal(invoiceId, col) {
  renderPaymentsModal(invoiceId, col);
}
function renderPaymentsModal(invoiceId, col) {
  const isOut = col === 'invoicesOut';
  const inv = byId(state[col], invoiceId);
  if (!inv) { closeModal(); return; }
  const payCol = isOut ? 'invoiceOutPayments' : 'invoiceInPayments';
  const lines = state[payCol].filter(p => p.invoiceId === invoiceId);
  const usingCustom = lines.length > 0;
  const totalAssigned = lines.reduce((s,l)=>s+Number(l.amount||0),0);
  const remaining = Number(inv.amount||0) - totalAssigned;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="payOverlay">
      <div class="modal" style="max-width:580px">
        <h3>${isOut?'Cobros':'Pagos'} de la factura ${escapeHtml(inv.number||'(sin número)')}</h3>
        <p class="field-hint">Importe total de la factura: <strong class="mono">${fmtMoney(inv.amount)}</strong></p>
        ${!usingCustom ? `<p class="muted" style="font-size:13px">De momento se trata como un único ${isOut?'cobro':'pago'} (los datos que pusiste al crear la factura). Añade uno nuevo aquí para empezar a repartirla.</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Importe</th><th>Fecha</th><th>Vto.</th><th>Tipo</th><th>${isOut?'Banco':'Observ.'}</th><th>${isOut?'Cobrado':'Pagado'}</th><th></th></tr></thead>
          <tbody>
            ${lines.length===0?`<tr><td colspan="7" class="empty">Sin pagos parciales todavía.</td></tr>`:''}
            ${lines.map(l=>`<tr>
              <td class="num">${fmtMoney(l.amount)}</td><td class="mono">${fmtDate(l.date)}</td><td class="mono">${fmtDate(l.dueDate)}</td><td>${escapeHtml(l.method||'')}</td>
              <td class="muted">${escapeHtml(isOut?(l.issuingBank||''):(l.note||''))}</td>
              <td style="text-align:center"><input type="checkbox" data-payid="${l.id}" ${(isOut?l.collected:l.paid)?'checked':''}></td>
              <td style="display:flex; gap:8px;"><button class="link-btn" data-editpay="${l.id}">Editar</button><button class="link-btn" data-delpay="${l.id}" style="color:var(--expense)">Quitar</button></td>
            </tr>`).join('')}
          </tbody>
        </table></div>
        <div class="field-hint" style="margin:8px 0">Asignado: ${fmtMoney(totalAssigned)} · Sin asignar: <strong style="color:${Math.abs(remaining)>0.01?'var(--warn)':'var(--income)'}">${fmtMoney(remaining)}</strong></div>
        <div class="modal-actions" style="justify-content:flex-start">
          <button class="btn btn-sm" id="addPayLine">+ Añadir ${isOut?'cobro':'pago'} parcial</button>
        </div>
        <div class="modal-actions"><button class="btn" id="payClose">Cerrar</button></div>
      </div>
    </div>`;
  document.getElementById('payOverlay').onclick = (e) => { if (e.target.id==='payOverlay') closeModal(); };
  document.getElementById('payClose').onclick = closeModal;
  document.getElementById('addPayLine').onclick = () => openPayLineForm(invoiceId, col, payCol, null, remaining > 0 ? remaining : inv.amount);
  root.querySelectorAll('[data-payid]').forEach(chk => chk.onchange = async () => {
    const field = isOut ? 'collected' : 'paid';
    const dateField = isOut ? 'collectedDate' : 'paidDate';
    const patch = { [field]: chk.checked };
    patch[dateField] = chk.checked ? todayISO() : '';
    await db.collection(payCol).doc(chk.dataset.payid).update(patch);
    setTimeout(() => renderPaymentsModal(invoiceId, col), 150);
  });
  root.querySelectorAll('[data-editpay]').forEach(b => b.onclick = () => openPayLineForm(invoiceId, col, payCol, b.dataset.editpay, 0));
  root.querySelectorAll('[data-delpay]').forEach(b => b.onclick = async () => {
    await db.collection(payCol).doc(b.dataset.delpay).delete();
    setTimeout(() => renderPaymentsModal(invoiceId, col), 150);
  });
}
function openPayLineForm(invoiceId, col, payCol, existingId, suggestedAmount) {
  const isOut = col === 'invoicesOut';
  const inv = byId(state[col], invoiceId);
  const existing = existingId ? state[payCol].find(p => p.id === existingId) : null;
  const draft = existing ? { ...existing } : {
    amount: suggestedAmount > 0 ? suggestedAmount : inv.amount, date: todayISO(), dueDate: inv.dueDate,
    method: inv.paymentMethod, issuingBank: '', note: '', remesado: false, remittanceBank: '',
    collected: false, collectedDate: '', paid: false, paidDate: '',
  };
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="lineOverlay"><div class="modal">
    <h3>${existingId?'Editar':'Nuevo'} ${isOut?'cobro':'pago'} parcial</h3>
    <form id="lineForm">
      <div class="form-row"><label>Importe (€)</label><input type="number" step="0.01" id="lf_amount" value="${draft.amount}"></div>
      <div class="form-row"><label>Fecha</label><input type="date" id="lf_date" value="${draft.date}"></div>
      <div class="form-row"><label>Forma de pago</label><select id="lf_method">${PAYMENT_METHODS.map(p=>`<option ${p===draft.method?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="form-row"><label>Vencimiento</label><input type="date" id="lf_due" value="${draft.dueDate||''}"></div>
      <div class="form-row"><label>${isOut?'Banco emisor':'Observaciones'}</label><input id="lf_bank" value="${escapeHtml(isOut?(draft.issuingBank||''):(draft.note||''))}"></div>
      <div class="form-row checkline"><input type="checkbox" id="lf_done" ${(isOut?draft.collected:draft.paid)?'checked':''}><label>Ya ${isOut?'cobrado':'pagado'}</label></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="lineCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div></div>`;
  document.getElementById('lineOverlay').onclick = (e) => { if (e.target.id==='lineOverlay') renderPaymentsModal(invoiceId, col); };
  document.getElementById('lineCancel').onclick = () => renderPaymentsModal(invoiceId, col);
  document.getElementById('lineForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {
      invoiceId,
      amount: Number(document.getElementById('lf_amount').value) || 0,
      date: document.getElementById('lf_date').value,
      dueDate: document.getElementById('lf_due').value,
      method: document.getElementById('lf_method').value,
    };
    const done = document.getElementById('lf_done').checked;
    if (isOut) {
      data.issuingBank = document.getElementById('lf_bank').value;
      data.collected = done; data.collectedDate = done ? todayISO() : '';
      data.remesado = draft.remesado || false; data.remittanceBank = draft.remittanceBank || '';
    } else {
      data.note = document.getElementById('lf_bank').value;
      data.paid = done; data.paidDate = done ? todayISO() : '';
    }
    try {
      if (existingId) await db.collection(payCol).doc(existingId).update(data);
      else await db.collection(payCol).add(data);
      showToast('Guardado');
    } catch (err) { console.error(err); showToast('No se pudo guardar.'); }
    setTimeout(() => renderPaymentsModal(invoiceId, col), 150);
  };
}

// ---------- boot ----------
renderNav();
document.getElementById('main').innerHTML = '<div class="empty">Cargando…</div>';
initDb();
initSample();
</script>
